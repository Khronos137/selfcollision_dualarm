controller_manager:
  ros__parameters:
    update_rate: 1000   # must match the Gazebo physics step (1 ms): velocity is re-applied every step

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    right_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController


# --------------------------------------------------------
# 1. CONTROLADOR IZQUIERDO (Mapeo de ROS 2)
# --------------------------------------------------------
left_velocity_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

# --------------------------------------------------------
# 2. CONTROLADOR DERECHO (Mapeo de ROS 2)
# --------------------------------------------------------
right_velocity_controller:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

# --------------------------------------------------------
# 3. PID gains of gazebo_ros2_control: DISABLED for the sign/velocity test.
#    With p = 100 on very light links (wrist roll and end link) the internal
#    loop can become unstable. Uncomment to restore the previous behaviour.
