controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    right_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

left_velocity_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

right_velocity_controller:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
